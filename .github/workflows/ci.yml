name: CI

# Quality gate for the library: lint, format, types, tests, branch coverage,
# and an isolated install of the built wheel on every push to main and every
# pull request. Integration tests skip automatically without OPENROUTER_API_KEY
# (none is provided here), so no secret is required. Windows runs too:
# development happens there and several tools encode deliberately
# Windows-aware behavior (write_bytes, directory-read checks).

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo; keep the default token read-only so a
# fork PR's run never holds write credentials.
permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # requires-python is an open-ended ">=3.12", so test the floor and
        # the latest stable line rather than claiming untested versions.
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing bare major-version aliases with v8,
        # so this pin is exact and needs a manual bump per upgrade.
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra mcp

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright

      - name: Test (pytest)
        run: uv run pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra mcp

      - name: Measure branch coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra mcp

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke test the installed wheel
        shell: bash
        run: |
          smoke_env="$RUNNER_TEMP/vibrantine-package-smoke"
          uv venv --python 3.12 "$smoke_env"
          uv pip install --python "$smoke_env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/python" "$GITHUB_WORKSPACE/tests/package_smoke.py"
