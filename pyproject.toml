[project]
name = "vibrantine"
version = "0.1.0.dev0"
description = "A component model for AI agents: typed, contracted, isolated units of LLM-driven work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Weir" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "openai",
]

[project.urls]
Repository = "https://github.com/vibrantine/vibrantine"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "basedpyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibrantine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real external services; skip without credentials.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
